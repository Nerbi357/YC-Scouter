name: Measure Form D coverage (spike)

# Button 3: ask SEC EDGAR how many YC companies can be found among Form D filers.
# Free, no keys, no writes to any dataset — it only produces a measurement and
# commits the report into data/spikes/.
on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: "How many companies to look up"
        required: false
        default: "200"

permissions:
  contents: write

concurrency:
  group: spike-formd-coverage
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --require-hashes
          pip install -e . --no-deps
          python -m ipykernel install --user --name python3

      - name: Run the spike (papermill)
        # SEC asks every client to identify itself. Set the repository secret
        # SEC_USER_AGENT to include a contact address; without it the run still
        # works and identifies the project by its repository URL.
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          papermill --log-output --no-progress-bar \
            notebooks/03_spike_formd_coverage.ipynb /tmp/out_spike.ipynb \
            -p sample_size ${{ inputs.sample_size }} -p out_dir data/spikes

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/spikes/formd_coverage_*.json
          if git diff --cached --quiet; then
            echo "No new measurement to commit."
          else
            git commit -m "Measure Form D coverage ($(date -u +%Y-%m-%d))"
            git push
          fi
