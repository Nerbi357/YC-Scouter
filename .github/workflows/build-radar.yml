name: Build YC Radar

# Run it manually from the GitHub UI: Actions → "Build YC Radar" → Run workflow.
# It runs on GitHub's servers — you can close your computer and download the
# resulting Excel from the run's Artifacts afterwards.
on:
  workflow_dispatch:
    inputs:
      use_ai:
        description: "Generate AI summaries via Groq (needs GROQ_API_KEY secret)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build the radar
        env:
          GROQ_API_KEY: ${{ inputs.use_ai && secrets.GROQ_API_KEY || '' }}
        run: python scripts/run_pipeline.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: yc-radar
          path: |
            data/processed/yc_radar.xlsx
            data/processed/yc_radar.csv
            data/processed/yc_radar.parquet
          if-no-files-found: error
          retention-days: 90
