name: Build AI Summary (File 2)

# Button 2: manually add ai_description + ai_risks to the latest Base dataset.
# Uses paid/keyed providers, so it's a SEPARATE workflow from File 1. Only new
# (id, model, prompt_version) keys are summarized (cache-guarded), then the dated
# AI files + the updated cache are committed.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider"
        type: choice
        options: [claude, groq]
        default: claude
      limit:
        description: "Max companies to summarize this run (blank = all; e.g. 5 for a cheap test)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build-ai-summary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --require-hashes
          pip install -e . --no-deps
          python -m ipykernel install --user --name python3

      - name: Run File 2 (papermill)
        run: |
          EXTRA=""
          if [ -n "${{ inputs.limit }}" ]; then EXTRA="-p limit ${{ inputs.limit }}"; fi
          papermill --log-output --no-progress-bar notebooks/02_ai_summary.ipynb /tmp/out_ai.ipynb \
            -p provider "${{ inputs.provider }}" -p output commit -p out_dir data $EXTRA

      - name: Commit dated AI files + cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/yc_dataset_ai_*.parquet data/yc_dataset_ai_*.xlsx data/cache/ai_cache.json
          if git diff --cached --quiet; then
            echo "No AI-summary changes to commit."
          else
            git commit -m "data: rebuild YC Dataset AI Summary ($(date -u +%Y-%m-%d))"
            git push
          fi
