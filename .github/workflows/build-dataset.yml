name: Build Dataset (File 1)

# Button 1: manually rebuild the "YC Dataset Base" (all companies 2020->now).
# No API keys needed. Runs the real notebook headlessly with papermill and commits
# the dated Base files (parquet + xlsx) into data/.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dataset
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --require-hashes
          pip install -e . --no-deps
          python -m ipykernel install --user --name python3

      - name: Run File 1 (papermill)
        run: |
          papermill notebooks/01_dataset_base.ipynb /tmp/out_base.ipynb \
            -p output commit -p out_dir data

      - name: Commit dated Base files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/yc_dataset_base_*.parquet data/yc_dataset_base_*.xlsx
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "data: rebuild YC Dataset Base ($(date -u +%Y-%m-%d))"
            git push
          fi
